<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uma perguntinha 💗</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --pink:#ff78ad;
      --pink-2:#ff9fc4;
      --pink-3:#ffd6e6;
      --pink-4:#fff0f6;
      --text:#8f345d;
      --dark:#6e2447;
      --white:#fff;
    }
    body{
      min-height:100vh;
      overflow:hidden;
      font-family: Inter, ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.85), transparent 28%),
        radial-gradient(circle at 82% 14%, rgba(255,255,255,.55), transparent 22%),
        linear-gradient(145deg,#ffd6e6 0%,#ffb7d2 45%,#ff96be 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--text);
      padding:24px;
      position:relative;
      touch-action:manipulation;
    }
    body::before,
    body::after{
      content:"";
      position:fixed;
      border-radius:50%;
      filter:blur(3px);
      opacity:.45;
      pointer-events:none;
    }
    body::before{
      width:320px;height:320px;
      background:#fff;
      left:-120px;top:-100px;
    }
    body::after{
      width:280px;height:280px;
      background:#ff5f9a;
      right:-120px;bottom:-110px;
      opacity:.18;
    }

    .heart-bg{
      position:fixed;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:0;
    }
    .heart-bg span{
      position:absolute;
      bottom:-50px;
      font-size:18px;
      opacity:.22;
      animation:floatUp linear infinite;
      filter:drop-shadow(0 4px 8px rgba(177,53,107,.15));
    }
    @keyframes floatUp{
      from{transform:translateY(0) rotate(0deg) scale(.8)}
      to{transform:translateY(-115vh) rotate(28deg) scale(1.15)}
    }

    .wrap{
      width:min(92vw,620px);
      position:relative;
      z-index:2;
      text-align:center;
    }
    .card{
      position:relative;
      background:rgba(255,255,255,.72);
      border:1.5px solid rgba(255,255,255,.92);
      box-shadow:
        0 24px 70px rgba(132,43,83,.20),
        inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border-radius:32px;
      padding:48px 32px 38px;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      width:160px;height:160px;
      border-radius:50%;
      background:radial-gradient(circle,#ff9ec3 0%,rgba(255,158,195,0) 72%);
      top:-70px;right:-50px;
      opacity:.45;
    }
    .mini{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      background:#fff4f8;
      color:#c24b7e;
      font-weight:700;
      font-size:.84rem;
      box-shadow:0 6px 18px rgba(180,67,119,.08);
      margin-bottom:18px;
    }
    .main-heart{
      width:82px;height:82px;
      margin:0 auto 16px;
      border-radius:26px;
      background:linear-gradient(145deg,#ff8fba,#ff5f9d);
      display:grid;
      place-items:center;
      font-size:38px;
      box-shadow:0 14px 30px rgba(255,83,149,.28);
      animation:pulse 1.9s ease-in-out infinite;
      transform:rotate(-3deg);
    }
    @keyframes pulse{
      0%,100%{transform:rotate(-3deg) scale(1)}
      50%{transform:rotate(3deg) scale(1.07)}
    }
    h1{
      font-size:clamp(2rem,7vw,3.3rem);
      line-height:1.05;
      color:var(--dark);
      letter-spacing:-1.8px;
      margin-bottom:14px;
    }
    .subtitle{
      width:min(100%,470px);
      margin:0 auto;
      font-size:clamp(1rem,3.5vw,1.15rem);
      line-height:1.65;
      color:#a45075;
    }
    .buttons{
      position:relative;
      min-height:132px;
      margin-top:26px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:16px;
    }
    .btn{
      border:0;
      border-radius:18px;
      padding:15px 28px;
      min-width:142px;
      font-size:1rem;
      font-weight:800;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
      font-family:inherit;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .yes{
      background:linear-gradient(135deg,#ff6aa6,#ff468d);
      color:white;
      box-shadow:0 12px 24px rgba(255,70,141,.28);
    }
    .yes:hover{transform:translateY(-3px) scale(1.02);filter:brightness(1.04)}
    .yes:active{transform:scale(.98)}
    .no{
      background:#fff;
      color:#bd5a84;
      border:1.5px solid #ffd2e2;
      box-shadow:0 10px 22px rgba(138,55,93,.10);
      position:fixed;
      z-index:20;
      transition:left .16s ease, top .16s ease, transform .16s ease;
      will-change:left,top,transform;
    }
    .hint{
      margin-top:4px;
      font-size:.82rem;
      color:#c47b9a;
    }
    footer{
      margin-top:18px;
      font-size:.84rem;
      color:#a95e7e;
    }
    footer a{
      color:#a7386b;
      font-weight:800;
      text-decoration:none;
    }

    .spark{
      position:fixed;
      pointer-events:none;
      z-index:50;
      animation:pop .8s ease forwards;
      font-size:20px;
    }
    @keyframes pop{
      0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
      25%{opacity:1}
      100%{transform:translate(-50%,-120%) scale(1.25);opacity:0}
    }

    @media (max-width:560px){
      body{padding:16px}
      .card{padding:38px 18px 28px;border-radius:28px}
      .main-heart{width:72px;height:72px;font-size:33px;border-radius:23px}
      .buttons{min-height:150px;margin-top:22px}
      .btn{min-width:132px;padding:14px 22px}
      .subtitle{max-width:92%}
    }
  </style>
</head>
<body>
  <div class="heart-bg" aria-hidden="true" id="heartBg"></div>

  <main class="wrap">
    <section class="card">
      <div class="mini">💌 tenho uma perguntinha...</div>
      <div class="main-heart">💗</div>
      <h1>Você quer namorar comigo?</h1>
      <p class="subtitle">Prometo te fazer rir, te encher de carinho e continuar escolhendo você todos os dias. 🥹💞</p>

      <div class="buttons" id="buttonArea">
        <button class="btn yes" id="yesBtn" onclick="window.location.href='sim.html'">SIM 💗</button>
      </div>
      <p class="hint">o “não” parece meio tímido... 👀</p>
    </section>

    <footer>
      Feito com carinho por Noel 💗 · <a href="https://instagram.com/noelzin_" target="_blank" rel="noopener noreferrer">@noelzin_</a>
    </footer>
  </main>

  <button class="btn no" id="noBtn">NÃO 😭</button>

  <script>
    const noBtn = document.getElementById('noBtn');
    const card = document.querySelector('.card');

    function clamp(v,min,max){ return Math.max(min, Math.min(max,v)); }

    function setInitialNoPosition(){
      const r = card.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();
      const x = r.left + r.width/2 + 22;
      const y = r.top + r.height - 132;
      noBtn.style.left = clamp(x, 12, innerWidth-btn.width-12) + 'px';
      noBtn.style.top = clamp(y, 12, innerHeight-btn.height-12) + 'px';
    }

    function moveNo(pointerX, pointerY){
      const rect = noBtn.getBoundingClientRect();
      const bw = rect.width || 142;
      const bh = rect.height || 56;
      const pad = 14;
      const maxX = Math.max(pad, innerWidth - bw - pad);
      const maxY = Math.max(pad, innerHeight - bh - pad);

      let bestX = pad, bestY = pad, bestScore = -1;
      for(let i=0;i<18;i++){
        const x = pad + Math.random() * Math.max(1, maxX-pad);
        const y = pad + Math.random() * Math.max(1, maxY-pad);
        const cx = x + bw/2, cy = y + bh/2;
        const dist = Math.hypot(cx-pointerX, cy-pointerY);
        const centerPenalty = Math.hypot(cx-innerWidth/2, cy-innerHeight/2) * .05;
        const score = dist + centerPenalty;
        if(score > bestScore){ bestScore = score; bestX = x; bestY = y; }
      }
      noBtn.style.left = bestX + 'px';
      noBtn.style.top = bestY + 'px';
      noBtn.style.transform = `rotate(${(Math.random()*16-8).toFixed(1)}deg)`;
    }

    noBtn.addEventListener('mouseenter', e => moveNo(e.clientX,e.clientY));
    noBtn.addEventListener('pointerdown', e => {
      e.preventDefault();
      moveNo(e.clientX,e.clientY);
    });
    noBtn.addEventListener('click', e => e.preventDefault());

    document.addEventListener('pointermove', e => {
      const r = noBtn.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top + r.height/2;
      const distance = Math.hypot(e.clientX-cx,e.clientY-cy);
      const triggerDistance = e.pointerType === 'touch' ? 95 : 78;
      if(distance < triggerDistance) moveNo(e.clientX,e.clientY);
    }, {passive:true});

    document.addEventListener('touchstart', e => {
      const t = e.touches[0];
      if(!t) return;
      const r = noBtn.getBoundingClientRect();
      if(t.clientX >= r.left-55 && t.clientX <= r.right+55 && t.clientY >= r.top-55 && t.clientY <= r.bottom+55){
        moveNo(t.clientX,t.clientY);
      }
    }, {passive:true});

    window.addEventListener('resize', setInitialNoPosition);
    requestAnimationFrame(setInitialNoPosition);

    const heartBg = document.getElementById('heartBg');
    const icons = ['💗','💕','💞','✨','🌸'];
    for(let i=0;i<18;i++){
      const s = document.createElement('span');
      s.textContent = icons[Math.floor(Math.random()*icons.length)];
      s.style.left = Math.random()*100 + '%';
      s.style.animationDuration = 7 + Math.random()*8 + 's';
      s.style.animationDelay = -Math.random()*12 + 's';
      s.style.fontSize = 14 + Math.random()*18 + 'px';
      heartBg.appendChild(s);
    }

    document.getElementById('yesBtn').addEventListener('pointerenter', e => sparkle(e.clientX,e.clientY));
    function sparkle(x,y){
      const s = document.createElement('div');
      s.className='spark';
      s.textContent = Math.random()>.5 ? '💗' : '✨';
      s.style.left=x+'px'; s.style.top=y+'px';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),800);
    }
  </script>
</body>
</html>
